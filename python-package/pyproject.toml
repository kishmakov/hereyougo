[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hereyougo"
dynamic = ["version"]
description = "Send a Telegram notification from your Python code"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "KiShmakov" },
]

[tool.setuptools.dynamic]
version = { attr = "hereyougo.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
